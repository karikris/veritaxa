[project]
name = "veritaxa-admin"
version = "0.1.0"
description = "Local-only administration tools for VeriTaxa review campaigns"
requires-python = ">=3.12"
dependencies = [
  "polars==1.43.2",
  "pyarrow==25.0.1",
  "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
