name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_synthetic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Python dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Run browser tests
        run: npm run test:e2e
      - name: Run admin-tool tests
        run: uv run pytest
      - name: Check Python
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Build production site
        run: npm run build
      - name: Scan for private review data
        run: npm run data:check
      - name: Check bundle size
        run: npm run bundle:check
      - name: Check whitespace
        run: git diff --check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx supabase start
      - name: Lint migrations
        run: npx supabase db lint --local --level warning
      - name: Run database security tests
        run: npm run test:db
