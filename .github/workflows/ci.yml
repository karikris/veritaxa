name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_synthetic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Python dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Run browser tests
        run: npm run test:e2e
      - name: Run admin-tool tests
        run: uv run pytest
      - name: Check Python
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Build production site
        run: npm run build
      - name: Scan for private review data
        run: npm run data:check
      - name: Check bundle size
        run: npm run bundle:check
      - name: Check whitespace
        run: git diff --check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx supabase start
      - name: Lint migrations
        run: npx supabase db lint --local --level warning
      - name: Run database security tests
        run: npm run test:db

  export-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: veritaxa_synthetic
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d veritaxa_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VERITAXA_SYNTHETIC_DSN: host=127.0.0.1 port=5432 dbname=veritaxa_synthetic user=synthetic password=synthetic-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --group dev
      - name: Prepare disposable synthetic database
        run: |
          uv run python -m benchmarks.export_database init
          uv run python -m benchmarks.export_database seed 10000
          uv run python -m benchmarks.export_database seed 100000
      - name: Verify database-to-file correctness and interruption handling
        run: uv run pytest tools/tests/test_export_database.py
      - name: Measure complete export paths in fresh processes
        run: uv run python -m benchmarks.export_gate --report export-memory.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: synthetic-export-memory
          path: export-memory.json
          if-no-files-found: warn

  import-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: veritaxa_import_synthetic
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d veritaxa_import_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VERITAXA_IMPORT_DSN: host=127.0.0.1 port=5432 dbname=veritaxa_import_synthetic user=synthetic password=synthetic-ci-only
      VERITAXA_IMPORT_FIXTURES: ${{ runner.temp }}/veritaxa-import-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --group dev
      - name: Prepare isolated database and bounded synthetic fixtures
        run: |
          uv run python -m benchmarks.import_database init
          for size in 10000 100000; do
            for format in csv parquet ndjson; do
              uv run python -m benchmarks.import_database generate "$size" --format "$format"
            done
          done
      - name: Verify insertion parity, atomicity and reader preservation
        run: uv run pytest tools/tests/test_import_database.py tools/tests/test_candidate_input.py
      - name: Measure complete import paths and compare insertion methods
        run: uv run python -m benchmarks.import_gate --report import-memory.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: synthetic-import-memory
          path: import-memory.json
          if-no-files-found: warn
